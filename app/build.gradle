plugins {
    id "com.android.application"
}

android {
    namespace "com.local.rotatefix"
    compileSdk 36

    defaultConfig {
        applicationId "com.local.rotatefix"
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName "1.0.2"
    }

    buildTypes {
        release {
            debuggable false
            signingConfig null
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

apply from: rootProject.file("gradle/store-release.gradle")

apply from: rootProject.file("gradle/release-safety.gradle")
